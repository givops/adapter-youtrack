name: Release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify tag matches the artifact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          test "$RELEASE_TAG" = "v$version"
      - name: Build release packages (verification runs locally before merge)
        run: ./scripts/build.sh --package-only
      - name: Prepare downloadable files
        run: |
          mkdir -p target/release
          cp target/adapter-youtrack-*.jar pom.xml LICENSE target/release/
          cp sdk-revision.txt target/release/
          cd target/release
          sha256sum *.jar pom.xml LICENSE sdk-revision.txt > SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" target/release/* --verify-tag --draft --generate-notes
